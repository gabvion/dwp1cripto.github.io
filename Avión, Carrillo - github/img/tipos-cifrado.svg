<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t d"><title id="t">Modelos de cifrado</title><desc id="d">El cifrado simétrico usa una clave compartida. El asimétrico usa una clave pública y una privada.</desc><rect width="720" height="430" rx="18" fill="#081832"/><g font-family="Arial,sans-serif"><text x="50" y="55" fill="#31e6c6" font-size="18" font-weight="700">SIMÉTRICO</text><rect x="50" y="85" width="170" height="80" rx="10" fill="#122d58" stroke="#36527c"/><text x="135" y="120" fill="#fff" text-anchor="middle" font-size="16">MENSAJE</text><text x="135" y="143" fill="#9bb0ce" text-anchor="middle" font-size="13">dato original</text><path d="M220 125h80" stroke="#8398b6" stroke-width="3"/><circle cx="345" cy="125" r="34" fill="#31e6c6"/><path d="M330 126h30m-10 0v12m-8-12v8" stroke="#07152f" stroke-width="6" stroke-linecap="round"/><path d="M379 125h80" stroke="#8398b6" stroke-width="3"/><rect x="460" y="85" width="210" height="80" rx="10" fill="#122d58" stroke="#36527c"/><text x="565" y="120" fill="#fff" text-anchor="middle" font-size="16">DATO CIFRADO</text><text x="565" y="143" fill="#9bb0ce" text-anchor="middle" font-size="13">una clave compartida</text><line x1="50" y1="210" x2="670" y2="210" stroke="#294367"/><text x="50" y="260" fill="#8c72ff" font-size="18" font-weight="700">ASIMÉTRICO</text><rect x="50" y="290" width="170" height="80" rx="10" fill="#122d58" stroke="#36527c"/><text x="135" y="325" fill="#fff" text-anchor="middle" font-size="16">MENSAJE</text><text x="135" y="348" fill="#9bb0ce" text-anchor="middle" font-size="13">dato original</text><path d="M220 330h70" stroke="#8398b6" stroke-width="3"/><circle cx="330" cy="310" r="28" fill="#8c72ff"/><circle cx="375" cy="350" r="28" fill="#31e6c6"/><text x="330" y="315" fill="#fff" text-anchor="middle" font-size="12" font-weight="700">PÚB.</text><text x="375" y="355" fill="#07152f" text-anchor="middle" font-size="12" font-weight="700">PRIV.</text><path d="M403